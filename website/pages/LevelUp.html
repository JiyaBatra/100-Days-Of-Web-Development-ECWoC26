<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', sans-serif;
}



/* Background Video */
video{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
}

/* Dark overlay */
.overlay{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.65);
  z-index:-1;
}

/* Scroll height */
.wrapper{
  height:400vh;
}

/* Sticky container */
.sticky{
  position:sticky;
  top:0;
  height:100vh;
  display:flex;
  align-items:left;
  justify-content:space-between;
  padding:0 8%;
}

/* Typography */
.hero-title .word {
  font-family: "Noto Sans", sans-serif;
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 800;
  line-height: 1.2;
  display: inline-block;



  /* Background Image */
  background-image: url("../../assets/for font/cosmic-space-galaxy-stockcake.png");
  background-size: 200% auto;
  background-position: 0% 70%;
  background-repeat: no-repeat;

  /* Text Clip */
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;

  /* Animation */
  animation: textMove 18s linear infinite;
}
@keyframes textMove {
  0% {
    background-position: 0% 50%;
  }
  50% {
    background-position: 100% 50%;
  }
  100% {
    background-position: 0% 50%;
  }
}

@keyframes fadeUp{
  from{opacity:0; transform:translateY(40px);}
  to{opacity:1; transform:translateY(0);}
}

.carousel-container{
  width:600px;
  height:350px;
  perspective:1000px;

  position:absolute;
  left:30%;
  top:60%;
  transform:translate(-50%, -50%);

  display:flex;
  align-items:center;
  justify-content:center;

  filter: drop-shadow(0 40px 80px rgba(0,0,0,0.6));
}

.carousel{
  width:100%;
  height:100%;
  position:relative;
  transform-style:preserve-3d;
  animation: rotateCarousel 18s linear infinite;
}

.carousel-item{
  position:absolute;
  width:250px;
  height:150px;

  left:50%;
  top:50%;

  transform-style:preserve-3d;
}

.carousel-item img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:15px;
}
.carousel:hover{
  animation-play-state: paused;
}
/* slides position around center */

.carousel-item:nth-child(1){
  transform: translate(-50%, -50%) rotateY(0deg) translateZ(350px);
}

.carousel-item:nth-child(2){
  transform: translate(-50%, -50%) rotateY(72deg) translateZ(350px);
}

.carousel-item:nth-child(3){
  transform: translate(-50%, -50%) rotateY(144deg) translateZ(350px);
}

.carousel-item:nth-child(4){
  transform: translate(-50%, -50%) rotateY(216deg) translateZ(350px);
}

.carousel-item:nth-child(5){
  transform: translate(-50%, -50%) rotateY(288deg) translateZ(350px);
}

/* rotation animation */

@keyframes rotateCarousel{
  from{
    transform: rotateY(0deg);
  }
  to{
    transform: rotateY(360deg);
  }
}
</style>
</head>

  <script src="../../website/scripts/components/cursor.js"></script>

<!-- Background Video -->

  </span>

    <span class="word">Need To Level Up 🚀</span>
  </span>
</div>

  <div class="carousel-container">
  <div class="carousel">

    <div class="carousel-item">
      <img src="../../assets/levelup/githubstats.png">
    </div>

    <div class="carousel-item">
      <img src="../../assets/levelup/contributiongraph.png">
    </div>

    <div class="carousel-item">
      <img src="../../assets/levelup/githubStreak.png">

    <div class="carousel-item">

    <div class="carousel-item">

    </div>

  </div>
</div>

   
  </div>

</div>

<script>
const images = document.querySelectorAll(".image-box img");
const totalImages = images.length;

window.addEventListener("scroll", () => {
  const scrollTop = window.scrollY;
  const scrollHeight = document.body.scrollHeight - window.innerHeight;

  // scroll percentage (0 to 1)
  const scrollPercent = scrollTop / scrollHeight;

  // calculate index dynamically
  const index = Math.min(
    totalImages - 1,
    Math.floor(scrollPercent * totalImages)
  );

  images.forEach(img => img.classList.remove("active"));
  images[index].classList.add("active");
});
</script>

</body>
